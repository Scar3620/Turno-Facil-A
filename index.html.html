<!doctype html>
<html lang="en">
  <head>
    <!-- Codificación de caracteres -->
    <meta charset="UTF-8" />

    <!-- Hace la página responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título de la pestaña -->
    <title>Document</title>

    <!-- Bootstrap CSS (estilos) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ================= HEADER / NAVBAR ================= -->
    <header>
      <nav class="navbar navbar-expand-lg bg-info-subtle">
        <div class="container-fluid">

          <!-- Logo / nombre -->
          <a class="navbar-brand" href="#">Turno Fácil</a>

          <!-- Botón para móviles -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Contenido del menú -->
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            
            <!-- Links del menú -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" href="#">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Servicios</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">¿Cómo funciona?</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Contacto</a>
              </li>
            </ul>

            <!-- Barra de búsqueda -->
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
              />
              <button class="btn btn-outline-dark me-2" type="submit">
                Search
              </button>
            </form>

            <!-- Botones de autenticación -->
            <a href="" class="btn btn-outline-dark me-2">Iniciar Sesión</a>
            <a href="" class="btn btn-secondary">Registrarse</a>
          </div>
        </div>
      </nav>
    </header>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main>
      <div class="container">
        <div class="row align-items-center">

          <!-- TEXTO PRINCIPAL -->
          <div class="col-md-6 mb-4">
            <h1 style="font-size: 55px;">
              Reserva tu turno de forma fácil y rápida
            </h1>

            <br>

            <p style="font-size: large;">
              Gestiona tus turnos en simples pasos, sin complicaciones!
            </p>

            <br>

            <!-- Botones principales -->
            <a href="" class="btn btn-dark">Reservar turno</a>
            <a href="" class="btn btn-outline-dark">Ver servicios</a>
          </div>

          <!-- IMAGEN -->
          <div class="col-md-6 text-center mt-3">
            <img 
              src="Imagen/turno-facil-logo.jpeg" 
              alt="Logo" 
              class="img-fluid"
            >
          </div>

        </div>
      </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer>
      2026 Turno fácil Colombia S.A
    </footer>

    <!-- Bootstrap JS (para menú responsive y componentes interactivos) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

  </body>
</html>
